# /docker/pulsearr-migrate on the Hostinger VPS: runs new supabase/migrations/NNN_*.sql files from main on their own.
# migrate.sh (next to this file) has the rules. Hostinger's Docker manager can't place files next to a project, so the
# script is embedded below as base64: after editing migrate.sh, regenerate this file with deploy/pulsearr-migrate/build.sh.
# PGPASSWORD (the sb-pulsearr Postgres password) is in this project's .env. The repo is public, so no GitHub token.
# Logs: docker logs pulsearr-migrate-migrate-1
name: pulsearr-migrate

services:
  migrate:
    image: postgres:17-alpine
    entrypoint:
      - sh
      - -c
      - apk add --no-cache git bash >/dev/null && echo "$$MIGRATE_SH" | base64 -d > /tmp/migrate.sh && exec bash /tmp/migrate.sh
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${PGPASSWORD}
      REPO: dev-perceptric/pulsearr
      BRANCH: main
      MIGRATE_SH: 
    networks: [sb]
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  sb:
    external: true
    name: sb-pulsearr
