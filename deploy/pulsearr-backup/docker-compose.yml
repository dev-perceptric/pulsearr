# /docker/pulsearr-backup on the Hostinger VPS: dumps the PulseARR database every night at BACKUP_AT (UTC), keeps
# KEEP_DAYS of dumps in /opt/backups/pulsearr on the server, and copies each one to Backblaze B2 when the B2 values are
# set. backup.sh (next to this file) has the rules. Hostinger's Docker manager can't place files next to a project, so
# the script is embedded below as base64: after editing backup.sh, regenerate this file with build.sh here.
# PGPASSWORD (the sb-pulsearr Postgres password) and the optional B2_KEY_ID, B2_APP_KEY, B2_BUCKET are in this
# project's .env. Logs: docker logs pulsearr-backup-backup-1
name: pulsearr-backup

services:
  backup:
    image: postgres:17-alpine
    entrypoint:
      - sh
      - -c
      - apk add --no-cache bash coreutils rclone >/dev/null && echo "$$BACKUP_SH" | base64 -d > /tmp/backup.sh && exec bash /tmp/backup.sh
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      PGDATABASE: postgres
      PGPASSWORD: ${PGPASSWORD}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-}
      BACKUP_AT: "03:15"
      KEEP_DAYS: "14"
      BACKUP_SH: 
    volumes:
      - /opt/backups/pulsearr:/backups
    networks: [sb]
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  sb:
    external: true
    name: sb-pulsearr
