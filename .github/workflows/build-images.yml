# Build the web and worker images and publish them to GitHub's container registry (ghcr.io), tagged latest and the
# commit. Then deploy them to the OVH server (149.56.19.140) and check they went live: job "deploy" SSHes in and runs
# deploy/deploy.sh (it pulls the new images and restarts pulsearr-web and pulsearr-worker), then waits until
# app.pulsearr.com/api/version shows this commit. The server's own autodeploy also pulls :latest every 5 minutes, so
# until the SSH settings below exist, the job skips the SSH step and only waits for that, which still fails the run
# when the new commit doesn't go live.
# The SSH step runs only once the repo has the variable DEPLOY_HOST. It needs (Settings, Secrets and variables, Actions):
#   variables: DEPLOY_HOST (the server's address), DEPLOY_USER (the SSH user), DEPLOY_PORT (optional, default 22),
#              APP_URL (optional, default https://app.pulsearr.com)
#   secrets:   DEPLOY_SSH_KEY (a private key made only for this), DEPLOY_KNOWN_HOSTS (the line from ssh-keyscan for the server)
# Server setup: deploy/README.md, Deploys.
#
# Why workflow_run: images must only come from a main commit that passed Checks. Checks runs on every push and pull
# request, so instead of repeating it here, this workflow starts when the Checks run for a push to main finishes,
# and only builds if it succeeded. It builds the exact commit Checks tested (workflow_run.head_sha), not whatever
# main points at by then. GitHub only reads workflow_run triggers from the default branch, which is main.
# workflow_dispatch builds the commit it's run on, without waiting for Checks (for a rebuild by hand).
name: Build images

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # NEXT_PUBLIC_POSTHOG_KEY is a repository variable (Settings > Secrets and variables > Actions > Variables).
          # Unset means PostHog is off in that build.
          - image: pulsearr-web
            file: Dockerfile
            args: |
              NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
              GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          - image: pulsearr-worker
            file: Dockerfile.worker
            args: |
              GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # One deploy at a time.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Restart the app and worker on the server
        if: ${{ vars.DEPLOY_HOST != '' }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's authorized_keys locks this key to deploy/deploy.sh, so the command here is only a fallback.
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER_NAME@$HOST" deploy.sh "$SHA"
      - name: Wait for the app to show this commit
        env:
          APP_URL: ${{ vars.APP_URL || 'https://app.pulsearr.com' }}
          # Without the SSH step this waits for the server's autodeploy (every 5 minutes, plus the pull).
          MINUTES: ${{ vars.DEPLOY_HOST != '' && '5' || '12' }}
        run: |
          # /api/version answers {"build":"<first 12 characters of the commit>"} (next.config.ts).
          want=${SHA:0:12}
          for _ in $(seq 1 $((MINUTES * 12))); do
            got=$(curl -fsS -m 10 "$APP_URL/api/version" | sed -n 's/.*"build":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ "$got" = "$want" ]; then echo "Live: $SHA"; exit 0; fi
            echo "Waiting for $want (server has ${got:-nothing yet})"
            sleep 5
          done
          echo "The server didn't switch to $SHA within $MINUTES minutes (it has ${got:-nothing})." >&2
          exit 1
